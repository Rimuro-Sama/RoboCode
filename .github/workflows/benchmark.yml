name: Benchmark

# Bateria longa contra todos os adversarios. Nao bloqueia nada: gera um relatorio.
# Roda sob demanda (aba Actions > Benchmark > Run workflow) e uma vez por semana.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds por confronto"
        required: false
        default: "20"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar o benchmark
        env:
          # entrada passada por variavel de ambiente (nunca interpolada direto no script) e validada
          ROUNDS: ${{ github.event.inputs.rounds || '20' }}
        run: |
          case "$ROUNDS" in
            ''|*[!0-9]*) echo "rounds invalido: $ROUNDS" >&2; exit 1 ;;
          esac
          mvn -B test -Pbenchmark -Dbenchmark.rounds="$ROUNDS"

      - name: Resumo na pagina da execucao
        if: always()
        run: |
          if [ -f target/benchmark/resultados.md ]; then
            cat target/benchmark/resultados.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar resultados (md e csv)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-resultados
          path: target/benchmark/
          if-no-files-found: warn
